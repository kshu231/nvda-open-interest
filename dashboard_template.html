<title>__OI_SYMBOL__ Open Interest</title>
<!-- Page content only (no html/head/body): nvda_oi.py wraps it in a document. -->
<style>
  /* Layout: one column of cards (stats, ranking, expirations) under a single filter row. */
  :root {
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --wash: rgba(11, 11, 11, 0.04);
    --call: #2a78d6;
    --put: #eb6834;
    --label-w: 178px;
    --value-w: 72px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --wash: rgba(255, 255, 255, 0.05);
      --call: #3987e5;
      --put: #d95926;
    }
  }
  :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --wash: rgba(255, 255, 255, 0.05);
      --call: #3987e5;
      --put: #d95926;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding-inline: 16px;
    padding-block: 24px 48px;
    background: var(--page);
    color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1040px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  h2 { font-size: 20px; margin: 0 0 4px; }
  .navs { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0 0 14px; }
  .pages { display: flex; gap: 6px; }
  .pages[hidden] { display: none; }
  .pages a {
    padding: 4px 12px; border: 1px solid var(--border); border-radius: 999px;
    font-size: 13px; color: var(--ink-2); text-decoration: none;
  }
  .pages a[href]:hover { background: var(--wash); color: var(--ink); }
  .pages a[aria-current] { background: var(--wash); color: var(--ink); font-weight: 650; }
  .meta { color: var(--ink-2); margin: 0; }
  .warning {
    margin: 12px 0 0; padding: 8px 12px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--wash); font-weight: 600;
  }
  .filters { display: flex; flex-wrap: wrap; gap: 16px; margin: 20px 0; align-items: end; }
  .filters label { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); }
  .filters label[hidden] { display: none; }
  select {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; min-width: 120px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; margin-bottom: 20px;
  }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .stats { margin-top: 14px; }
  .stats th { text-align: left; font-weight: 650; }
  .stats td { text-align: right; }
  .stats th, .stats td { padding: 10px 6px; border-bottom: 1px solid var(--grid); }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 12px 0 6px; font-size: 13px; color: var(--ink-2); }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .plot { position: relative; margin-top: 4px; }
  .gridlines, .axis { position: absolute; left: var(--label-w); right: var(--value-w); }
  .gridlines { top: 0; bottom: 0; border-left: 1px solid var(--axis); }
  .gridlines i { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--grid); }
  .row {
    position: relative; display: grid; grid-template-columns: var(--label-w) 1fr;
    align-items: center; height: 28px; border-radius: 6px; outline: none;
    color: inherit; text-decoration: none;
  }
  .row:hover, .row:focus-visible { background: var(--wash); }
  .row:hover .bar, .row:focus-visible .bar { filter: brightness(1.12); }
  .name {
    padding-right: 12px; text-align: right; font-size: 13px; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .track { display: flex; align-items: center; min-width: 0; }
  .bar { height: 12px; min-width: 2px; border-radius: 0 4px 4px 0; flex: none; }
  .bar.call { background: var(--call); }
  .bar.put { background: var(--put); }
  .value {
    margin-left: 8px; font-size: 13px; font-weight: 650; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .axis-band { position: relative; height: 26px; }
  .axis { top: 6px; }
  .axis span {
    position: absolute; transform: translateX(-50%); font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .empty { padding: 24px 0; color: var(--ink-2); }

  /* Gamma exposure: level tiles, then two plots on one strike axis (bars, profile). */
  .tiles {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 12px 16px; margin: 14px 0 4px;
    font-variant-numeric: tabular-nums;
  }
  .tile span { display: block; font-size: 12px; color: var(--ink-2); }
  .tile b { font-size: 20px; font-weight: 650; }
  #gex-chart svg { display: block; width: 100%; touch-action: pan-y; outline: none; }
  #gex-chart svg:focus-visible { outline: 2px solid var(--axis); outline-offset: 2px; border-radius: 6px; }
  .gx-grid { stroke: var(--grid); }
  .gx-zero { stroke: var(--axis); }
  .gx-tick, .gx-label { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .gx-label, .gx-title { fill: var(--ink-2); }
  .gx-label { paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
  .gx-title { font-size: 12px; }
  .gx-pos { fill: var(--call); }
  .gx-neg { fill: var(--put); }
  .gx-wash { opacity: 0.1; }
  .gx-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .gx-line.gx-pos { stroke: var(--call); }
  .gx-line.gx-neg { stroke: var(--put); }
  .gx-level { stroke: var(--ink-2); stroke-dasharray: 3 3; }
  .gx-level.spot { stroke: var(--ink); stroke-dasharray: none; }
  .gx-cross { stroke: var(--muted); }
  .gx-dot { stroke: var(--surface); stroke-width: 2; }
  .gx-bar.on { filter: brightness(1.15); }
  details.table-view { margin-top: 8px; font-size: 13px; color: var(--ink-2); }
  details.table-view summary { cursor: pointer; width: fit-content; }
  /* Live price: a status line under the card's date line, with its controls. */
  .live {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 10px 0 0;
    font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums;
  }
  .live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--axis); flex: none; }
  .live.on .dot { background: var(--ink); animation: beat 2s ease-in-out infinite; }
  @keyframes beat { 50% { opacity: 0.3; } }
  @media (prefers-reduced-motion: reduce) { .live.on .dot { animation: none; } }
  .live button {
    font: inherit; color: var(--ink-2); background: none; cursor: pointer;
    padding: 3px 12px; border: 1px solid var(--border); border-radius: 999px;
  }
  .live button:hover { background: var(--wash); color: var(--ink); }
  .live form { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; flex-basis: 100%; margin: 0; }
  .live form[hidden] { display: none; }
  .live input {
    font: inherit; color: var(--ink); background: var(--surface); width: 26ch; min-width: 0;
    border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px;
  }

  .expiries { margin-top: 12px; font-size: 14px; }
  .expiries th, .expiries td { padding: 7px 8px; text-align: right; border-bottom: 1px solid var(--grid); }
  .expiries th { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .expiries th:first-child, .expiries td:first-child { text-align: left; }
  .expiries.plain { color: var(--ink); }
  .expiries.plain tbody tr { cursor: default; }
  .expiries.plain tbody tr:last-child td { border-bottom: 0; }
  .expiries tbody tr { cursor: pointer; }
  .expiries tbody tr:hover { background: var(--wash); }
  .expiries tr.selected { background: var(--wash); font-weight: 650; }
  .expiries button {
    font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer;
    text-decoration: underline; text-decoration-color: var(--axis); text-underline-offset: 3px;
  }
  .expiries tfoot td { font-weight: 650; border-bottom: 0; }
  .scroll { overflow-x: auto; }
  footer { color: var(--muted); font-size: 12px; }

  #tip {
    position: fixed; z-index: 10; pointer-events: none; max-width: 260px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18); padding: 8px 10px; font-size: 13px;
  }
  #tip b { display: block; font-size: 16px; }
  #tip .key { display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  #tip div { color: var(--ink-2); }

  /* Phone: the contract name sits above its bar so the bar gets the full width. */
  @media (max-width: 600px) {
    :root { --label-w: 0px; --value-w: 64px; }
    .card { padding: 14px; }
    .row { grid-template-columns: 1fr; height: auto; padding-block: 5px; row-gap: 3px; }
    .name { text-align: left; padding-right: 0; font-size: 12px; color: var(--ink-2); }
    .filters { gap: 12px; }
    .filters label { flex: 1 1 130px; }
    select { width: 100%; }
    .live input { flex: 1 1 140px; }
  }
</style>
<main>
  <div class="navs">
    <nav class="pages" aria-label="Symbols" id="symbols"></nav>
    <nav class="pages" aria-label="Pages">
      <a aria-current="page">Latest</a>
      <a id="history-link">History</a>
    </nav>
  </div>
  <h1 id="title">__OI_SYMBOL__ Open Interest</h1>
  <p class="meta" id="meta"></p>
  <p class="warning" id="warning" hidden></p>

  <div class="filters">
    <label>Expiration <select id="expiry"></select></label>
    <label>Type
      <select id="side">
        <option value="both">Calls &amp; puts</option>
        <option value="call">Calls</option>
        <option value="put">Puts</option>
      </select>
    </label>
    <label>Show
      <select id="top">
        <option>10</option><option selected>20</option><option>30</option><option>50</option>
      </select>
    </label>
    <label id="range-filter" hidden>Strike range
      <select id="range">
        <option value="0.1">Spot ±10%</option>
        <option value="0.2" selected>Spot ±20%</option>
        <option value="0.3">Spot ±30%</option>
        <option value="0.5">Spot ±50%</option>
        <option value="all">All strikes</option>
      </select>
    </label>
    <label id="basis-filter" hidden>Gamma exposure by
      <select id="basis">
        <option value="oi">Open interest</option>
        <option value="volume">Today's volume</option>
      </select>
    </label>
  </div>

  <section class="card">
    <h2>Open Interest Stats</h2>
    <table class="stats"><tbody id="stats"></tbody></table>
  </section>

  <section class="card" id="gex-card" hidden>
    <h2>Gamma Exposure</h2>
    <p class="meta" id="gex-meta"></p>
    <div class="live" id="live">
      <i class="dot" aria-hidden="true" hidden></i>
      <span id="live-status"></span>
      <button type="button" id="live-on">Live price</button>
      <button type="button" id="live-retry" hidden>Try again</button>
      <button type="button" id="live-off" hidden>Turn off</button>
      <form id="live-form" hidden>
        <input id="live-key" aria-label="Finnhub API key" placeholder="Finnhub API key"
               autocomplete="off" autocapitalize="off" spellcheck="false" required>
        <button type="submit">Connect</button>
        <button type="button" id="live-cancel">Cancel</button>
      </form>
    </div>
    <div class="tiles" id="gex-tiles"></div>
    <div class="legend">
      <span><i class="swatch" style="background:var(--call)"></i>Net positive</span>
      <span><i class="swatch" style="background:var(--put)"></i>Net negative</span>
    </div>
    <div id="gex-chart"></div>
    <details class="table-view" id="gex-details">
      <summary>Table view</summary>
      <div class="scroll">
        <table class="expiries plain">
          <thead id="gex-table-head"></thead>
          <tbody id="gex-table"></tbody>
        </table>
      </div>
    </details>
  </section>

  <section class="card">
    <h2>Highest Open Interest Options</h2>
    <div class="legend">
      <span><i class="swatch" style="background:var(--call)"></i>Calls</span>
      <span><i class="swatch" style="background:var(--put)"></i>Puts</span>
    </div>
    <div class="plot" id="plot"></div>
    <div class="axis-band"><div class="axis" id="axis"></div></div>
  </section>

  <section class="card">
    <h2>All Expirations</h2>
    <div class="scroll">
      <table class="expiries">
        <thead><tr><th>Expiration</th><th>Call OI</th><th>Put OI</th><th>Total OI</th><th>Put/call</th></tr></thead>
        <tbody id="expiries"></tbody>
        <tfoot id="expiries-total"></tfoot>
      </table>
    </div>
  </section>

  <footer id="footer"></footer>
</main>
<div id="tip" role="status" hidden></div>

<script id="data" type="application/json">__OI_DATA__</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent);
  var listed = D.rows.map(function (r) { return { expiry: r[0], strike: r[1], side: r[2], oi: r[3] }; });
  // An expiration before today (Eastern date) has passed and its options are gone, so it is
  // left out of the picker, the totals and the rankings. A page so old that every
  // expiration has passed still shows what it has.
  var today = new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" });
  var rows = listed.filter(function (r) { return r.expiry >= today; });
  if (!rows.length) rows = listed;
  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (n) { return n.toLocaleString("en-US"); };
  var ratio = function (calls, puts) { return calls ? (puts / calls).toFixed(2) : "n/a"; };

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  // Totals per expiration, in date order.
  var byExpiry = {};
  rows.forEach(function (r) {
    var t = byExpiry[r.expiry] || (byExpiry[r.expiry] = { call: 0, put: 0 });
    t[r.side] += r.oi;
  });
  var expiries = Object.keys(byExpiry).sort();
  var grand = expiries.reduce(function (a, e) {
    return { call: a.call + byExpiry[e].call, put: a.put + byExpiry[e].put };
  }, { call: 0, put: 0 });

  function weekday(iso) {
    return new Date(iso + "T12:00:00").toLocaleDateString("en-US", { weekday: "short" });
  }
  // Standard monthly options expire on the third Friday of the month, or on the
  // Thursday before it when that Friday is a market holiday (no Friday listed).
  function isMonthly(iso, dates) {
    var p = iso.split("-").map(Number), first = new Date(p[0], p[1] - 1, 1).getDay();
    var third = 15 + (5 - first + 7) % 7;
    var friday = iso.slice(0, 8) + (third < 10 ? "0" : "") + third;
    return p[2] === third || (p[2] === third - 1 && dates.indexOf(friday) < 0);
  }
  // "2026-11-20 (Fri, 34d) · Monthly": days counted from today, Eastern. Each is worked out
  // once: SPY lists dozens of expirations and every render relabels them.
  var labels = {};
  function expiryLabel(iso, dates) {
    if (labels[iso]) return labels[iso];
    var days = Math.round((Date.parse(iso + "T00:00:00Z") - Date.parse(today + "T00:00:00Z")) / 864e5);
    return (labels[iso] = iso + " (" + weekday(iso) + (days >= 0 ? ", " + (days ? days + "d" : "today") : "") + ")" +
      (isMonthly(iso, dates) ? " · Monthly" : ""));
  }
  function contractName(r) {
    var p = r.expiry.split("-");
    var strike = r.strike.indexOf(".") < 0 ? r.strike + ".0" : r.strike;
    return D.symbol + " " + p[1] + "/" + p[2] + "/" + p[0].slice(2) + " " + strike + (r.side === "call" ? "C" : "P");
  }
  // The history page, opened on an expiration ("all" for every one) and optionally one option.
  function historyHref(expiry, r) {
    return D.historyPage + "#expiry=" + expiry +
      (r ? "&option=" + r.strike + (r.side === "call" ? "C" : "P") : "");
  }

  // Open on the expiration in the link (#expiry=2026-10-09 or #expiry=all, as the history
  // page links here), else the nearest remaining one.
  var state = { expiry: expiries[0], side: "both", top: 20, range: 0.2, basis: "oi" };
  var linked = new URLSearchParams(location.hash.slice(1)).get("expiry");
  if (linked === "all" || byExpiry[linked]) state.expiry = linked;
  var ready = false;

  $("meta").textContent = "As of " + D.asof;
  if (D.warning) { $("warning").hidden = false; $("warning").textContent = D.warning; }
  $("footer").textContent = "Source: OCC" + (D.gex ? ", Cboe" : "");

  // The same page for each symbol, opened on the same expiration when that symbol has it.
  var symbolLinks = (D.symbolPages || []).map(function (pair) {
    var link = el("a", "", pair[0]);
    if (pair[0] === D.symbol) link.setAttribute("aria-current", "page");
    else link.dataset.page = pair[1];
    $("symbols").appendChild(link);
    return link;
  });
  $("symbols").hidden = symbolLinks.length < 2;

  var expirySelect = $("expiry");
  expiries.forEach(function (e) {
    var opt = el("option", "", expiryLabel(e, expiries));
    opt.value = e;
    expirySelect.appendChild(opt);
  });
  var all = el("option", "", "All expirations");
  all.value = "all";
  expirySelect.appendChild(all);

  function renderStats() {
    var t = state.expiry === "all" ? grand : byExpiry[state.expiry];
    var body = $("stats");
    body.textContent = "";
    [["Calls", fmt(t.call)],
     ["Puts", fmt(t.put)],
     ["Total", fmt(t.call + t.put)],
     ["Put/call ratio", ratio(t.call, t.put)]].forEach(function (pair) {
      var tr = el("tr");
      var th = el("th", "", pair[0]);
      th.scope = "row";
      tr.appendChild(th);
      tr.appendChild(el("td", "", pair[1]));
      body.appendChild(tr);
    });
  }

  function niceStep(max) {
    var raw = max / 7, pow = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / pow;
    return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * pow;
  }
  function tickText(v) {
    if (v === 0) return "0";
    return v >= 1e6 ? +(v / 1e6).toFixed(2) + "M" : v >= 1e3 ? +(v / 1e3).toFixed(1) + "K" : String(v);
  }

  var tip = $("tip");
  function showTip(r, rank, scopeTotal, x, y) {
    tip.textContent = "";
    tip.appendChild(el("b", "", fmt(r.oi)));
    var name = el("div");
    var key = el("i", "key");
    key.style.background = "var(--" + r.side + ")";
    name.appendChild(key);
    name.appendChild(document.createTextNode(contractName(r)));
    tip.appendChild(name);
    tip.appendChild(el("div", "", "#" + rank + " · " + (100 * r.oi / scopeTotal).toFixed(1) +
      "% of " + (state.expiry === "all" ? "all" : "this expiration's") + " open interest"));
    placeTip(x, y);
  }
  function placeTip(x, y) {
    tip.hidden = false;
    var w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(x + 14, window.innerWidth - w - 8)) + "px";
    tip.style.top = Math.max(8, Math.min(y + 14, window.innerHeight - h - 8)) + "px";
  }
  function hideTip() { tip.hidden = true; }

  function renderRanking() {
    var scoped = rows.filter(function (r) { return state.expiry === "all" || r.expiry === state.expiry; });
    var scopeTotal = scoped.reduce(function (a, r) { return a + r.oi; }, 0);
    var ranked = scoped
      .filter(function (r) { return (state.side === "both" || r.side === state.side) && r.oi > 0; })
      .sort(function (a, b) { return b.oi - a.oi; })
      .slice(0, state.top);
    var plot = $("plot"), axis = $("axis");
    plot.textContent = "";
    axis.textContent = "";
    if (!ranked.length) {
      plot.appendChild(el("p", "empty", "No open interest for this selection."));
      return;
    }
    var max = ranked[0].oi, step = niceStep(max);
    var grid = el("div", "gridlines");
    for (var v = step; v <= max; v += step) {
      var line = el("i");
      line.style.left = (100 * v / max) + "%";
      grid.appendChild(line);
    }
    plot.appendChild(grid);
    for (var t = 0; t <= max; t += step) {
      var tick = el("span", "", tickText(t));
      tick.style.left = (100 * t / max) + "%";
      axis.appendChild(tick);
    }
    ranked.forEach(function (r, i) {
      var row = el("a", "row");
      row.href = historyHref(r.expiry, r);
      row.setAttribute("aria-label", contractName(r) + ", open interest " + fmt(r.oi) + ", see its history");
      row.appendChild(el("div", "name", contractName(r)));
      var track = el("div", "track");
      var bar = el("div", "bar " + r.side);
      // The value label rides the bar tip, in the gutter kept free on the right.
      bar.style.width = "calc((100% - var(--value-w)) * " + (r.oi / max) + ")";
      track.appendChild(bar);
      track.appendChild(el("span", "value", fmt(r.oi)));
      row.appendChild(track);
      row.addEventListener("pointermove", function (ev) { showTip(r, i + 1, scopeTotal, ev.clientX, ev.clientY); });

      hideGexReadout = gexReadout = null;
      $("gex-chart").textContent = "";
      $("gex-chart").appendChild(el("p", "empty", closed ? "These options expired at the 4:00 PM ET close."
        : "No gamma exposure for this selection."));
      return;
    }
    var levels = gexLevels(m, spot);
    [["Net exposure", money(levels.net, true)],
     ["Spot", spot.toFixed(2)],
     ["Call wall", levels.callWall === null ? "n/a" : price(levels.callWall)],
     ["Put wall", levels.putWall === null ? "n/a" : price(levels.putWall)],
     ["Zero gamma", levels.flip === null ? "None nearby" : levels.flip.toFixed(1)]].forEach(function (pair) {
      var tile = el("div", "tile");
      tile.appendChild(el("span", "", pair[0]));
      tile.appendChild(el("b", "", pair[1]));
      tiles.appendChild(tile);
    });

    var inView = drawGex(m, levels, spot, keep), unit = byVolume ? "volume" : "OI", tr = el("tr");
    ["Strike", "Call gamma", "Put gamma", "Net", "Call " + unit, "Put " + unit].forEach(function (name) {
      tr.appendChild(el("th", "", name));
    });
    head.appendChild(tr);
    inView.forEach(function (r) {
      var row = el("tr");
      [price(r.k), money(r.call, true), money(-r.put, true), money(r.call - r.put, true), fmt(r.calls), fmt(r.puts)]
        .forEach(function (cell) { row.appendChild(el("td", "", cell)); });
      body.appendChild(row);
    });
  }

  // A hosted page picks up newer snapshots by itself; a local file keeps the embedded one.
  function refreshGex() {
    if (location.protocol === "file:" || document.hidden) return;
    fetch(D.gexFile + "?t=" + Date.now(), { cache: "no-store" })
      .then(function (response) { return response.ok ? response.json() : null; })
      .then(function (snapshot) {
        if (snapshot && snapshot.expiries && (!G || Date.parse(snapshot.quoteTime) > Date.parse(G.quoteTime))) {
          G = snapshot;
          renderGex();
          connectLive();
        }
      })
      .catch(function () {});
  }

  // ---- Live price ------------------------------------------------------------
  // With a Finnhub API key (free at finnhub.io) the page follows the stock's trades over
  // Finnhub's websocket and redraws the gamma exposure at the latest price, at most once a
  // second. Open interest, implied volatility and volume stay the snapshot's. The key is
  // kept in this browser's storage and sent only to Finnhub, so it never reaches the repository.
  var STORE_KEY = "finnhubKey";
  var live = { key: "", socket: null, state: "off", message: "", dropped: false, prices: [], price: 0, time: 0,
               failures: 0, timer: null, pending: null, drawnAt: 0, drawn: "", held: false };
  try { live.key = localStorage.getItem(STORE_KEY) || ""; } catch (e) { /* storage blocked */ }

  // The live price, once a trade newer than the snapshot's quotes has come in. A connection
  // that has given up falls back to the snapshot's price rather than show a stale one as live.
  function livePrice() {
    return live.price && live.state !== "failed" && G && live.time > Date.parse(G.quoteTime) ? live : null;
  }
  // A live redraw is due when the price moves a cent or the minute (time to expiry) turns.
  function liveMark(lp) {
    return lp ? Math.round(lp.price * 100) + " " + Math.floor(lp.time / 6e4) : "";
  }

  function connectLive() {
    clearTimeout(live.timer);
    if (!live.key || live.socket || document.hidden || !(G && G.expiries)) return;
    var socket, openedAt = 0;
    try {
      socket = new WebSocket("wss://ws.finnhub.io?token=" + encodeURIComponent(live.key));
    } catch (e) {
      live.state = "failed";
      renderLive();
      return;
    }
    live.socket = socket;
    live.state = "connecting";
    socket.onopen = function () {
      openedAt = Date.now();
      live.state = "open";
      live.message = "";
      live.prices = [];
      socket.send(JSON.stringify({ type: "subscribe", symbol: D.symbol }));
      renderLive();
    };
    socket.onmessage = function (ev) {
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.type === "trade" && Array.isArray(msg.data)) {
        msg.data.forEach(function (trade) { if (trade.s === D.symbol) addTrade(+trade.p, +trade.t); });
      } else if (msg.type === "error") {
        live.message = String(msg.msg || "");
        renderLive();
      }
    };
    socket.onclose = function () {
      if (live.socket !== socket) return;  // closed on purpose
      live.socket = null;
      // Refused, or dropped within seconds: most often a key Finnhub won't take, or one
      // already streaming to another page. Three of those in a row and it stops trying.
      live.failures = openedAt && Date.now() - openedAt > 1e4 ? 0 : live.failures + 1;
      live.dropped = !!openedAt;
      if (live.failures >= 3) {
        live.state = "failed";
        if (live.drawn) redrawGex();
      } else {
        live.state = "retrying";
        live.timer = setTimeout(connectLive, 2000 * Math.pow(2, live.failures));
      }
      renderLive();
    };
    renderLive();
  }
  function stopLive(state) {
    clearTimeout(live.timer);
    clearTimeout(live.pending);
    live.pending = null;
    var socket = live.socket;
    live.socket = null;
    if (socket) socket.close();
    live.state = state;
  }

  // The price is the median of the last five trades, so one stray print (an odd lot, a late
  // report) doesn't move it; a trade stamped over 10 seconds before the newest is skipped.
  function addTrade(p, t) {
    if (!(p > 0) || !(t > 0) || t < live.time - 1e4) return;
    live.prices.push(p);
    if (live.prices.length > 5) live.prices.shift();
    var sorted = live.prices.slice().sort(function (a, b) { return a - b; });
    live.price = sorted[sorted.length >> 1];
    live.time = Math.max(live.time, t);
    if (live.pending) return;
    live.pending = setTimeout(function () {
      live.pending = null;
      live.drawnAt = Date.now();
      var lp = livePrice();
      if (lp && liveMark(lp) !== live.drawn) redrawGex();
      renderLive();
    }, Math.max(0, live.drawnAt + 1000 - Date.now()));
  }

  // A live price redraws the card. A readout opened by touch or the keyboard holds the redraw
  // until it closes (it is being read, and a screen reader would repeat it every second); a
  // mouse readout, and focus, carry over to the new chart.
  function redrawGex() {
    if (gexReadout && gexReadout.mode !== "mouse") { live.held = true; return; }
    var old = $("gex-chart").querySelector("svg");
    renderGex({ readout: gexReadout, focused: !!old && document.activeElement === old });
  }

  function tradeTime(ms) {
    var at = new Date(ms), zone = { timeZone: "America/New_York" };
    var day = at.toLocaleDateString("en-CA", zone) === new Date().toLocaleDateString("en-CA", zone) ? ""
      : at.toLocaleDateString("en-US", { timeZone: "America/New_York", weekday: "short" }) + " ";
    return day + at.toLocaleTimeString("en-US", { timeZone: "America/New_York", hour: "numeric",
      minute: "2-digit", second: "2-digit" }) + " ET";
  }

  // Off, it is just the button; on, a dot and the state (the price itself is the Spot tile).
  function renderLive() {
    var on = !!live.key, editing = !$("live-form").hidden, lp = livePrice(), text = "";
    var streaming = !!(lp && live.state === "open");
    $("live").classList.toggle("on", streaming);
    $("live").querySelector(".dot").hidden = !on;
    $("live-on").hidden = on || editing;
    $("live-off").hidden = !on;
    $("live-retry").hidden = live.state !== "failed";
    if (!on) text = "";
    else if (live.state === "failed") text = live.message ? "Finnhub: " + live.message
      : live.dropped ? "Connection keeps closing (key open on another page?)" : "Couldn't connect to Finnhub";
    else if (live.state === "retrying") text = "Reconnecting…";
    else if (streaming) text = "Live · " + tradeTime(lp.time);
    else if (live.state === "open") text = "Live · waiting for a trade";
    else if (live.state === "paused" || document.hidden) text = "Paused";
    else text = "Connecting…";
    $("live-status").textContent = text;
    $("live-status").hidden = !text;
  }

  $("live-on").addEventListener("click", function () {
    $("live-form").hidden = false;
    renderLive();
    $("live-key").focus();
  });
  $("live-cancel").addEventListener("click", function () {
    $("live-form").hidden = true;
    renderLive();
    $("live-on").focus();
  });
  $("live-form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var key = $("live-key").value.trim();
    if (!key) return;
    $("live-form").hidden = true;
    $("live-key").value = "";
    live.key = key;
    try { localStorage.setItem(STORE_KEY, key); } catch (e) { /* kept for this visit only */ }
    live.failures = 0;
    connectLive();
  });
  $("live-retry").addEventListener("click", function () {
    live.failures = 0;
    connectLive();
  });
  $("live-off").addEventListener("click", function () {
    stopLive("off");
    live.key = live.message = "";
    live.prices = [];
    live.price = live.time = 0;
    try { localStorage.removeItem(STORE_KEY); } catch (e) { /* nothing stored */ }
    renderLive();
    renderGex();
  });
  // The connection closes while the page is hidden and opens again when it is shown.
  document.addEventListener("visibilitychange", function () {
    if (!live.key) return;
    if (document.hidden) {
      stopLive("paused");
    } else {
      live.failures = 0;
      connectLive();
      if (liveMark(livePrice()) !== live.drawn) redrawGex();  // a redraw dropped on hiding
    }
    renderLive();
  });

  function render() {
    expirySelect.value = state.expiry;
    $("history-link").href = historyHref(state.expiry);
    symbolLinks.forEach(function (link) {
      if (link.dataset.page) link.href = link.dataset.page + "#expiry=" + state.expiry;
    });
    if (ready && location.hash !== "#expiry=" + state.expiry) {
      try { history.replaceState(null, "", "#expiry=" + state.expiry); } catch (e) { /* some browsers refuse on file:// */ }
    }
    hideTip();
    renderStats();
    renderGex();
    renderRanking();
    renderExpiries();
  }

  expirySelect.addEventListener("change", function () { state.expiry = expirySelect.value; render(); });
  $("side").addEventListener("change", function (ev) { state.side = ev.target.value; render(); });
  $("top").addEventListener("change", function (ev) { state.top = +ev.target.value; render(); });
  $("range").addEventListener("change", function (ev) {
    state.range = ev.target.value === "all" ? "all" : +ev.target.value;
    renderGex();
  });
  $("basis").addEventListener("change", function (ev) { state.basis = ev.target.value; renderGex(); });
  // The chart is drawn to its container's pixel width, so redraw when that changes.
  function fitGex() {
    var width = $("gex-chart").clientWidth;
    if (width && width !== drawnWidth) renderGex();
  }
  if (window.ResizeObserver) new ResizeObserver(fitGex).observe($("gex-chart"));
  else window.addEventListener("resize", fitGex);
  render();
  ready = true;
  refreshGex();
  setInterval(refreshGex, 5 * 60 * 1000);
  document.addEventListener("visibilitychange", refreshGex);
  renderLive();
  connectLive();
})();
</script>
