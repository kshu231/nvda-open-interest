name: Daily open interest

on:
  # Started by a Google Cloud Scheduler job through the evening, when the OCC
  # posts the day's numbers, and again before the next open (see the README).
  # GitHub's own schedule trigger started runs hours late or not at all, so
  # there is none here.
  workflow_dispatch:
    inputs:
      timer:
        description: "Started by the scheduler: republish only if the OCC has new data"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["nvda_oi.py", "nvda_gex.py", "dashboard_template.html", "history_template.html",
            "build_site.sh", ".github/workflows/daily.yml"]

concurrency:
  group: daily-open-interest
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.pull.outputs.publish }}
      failed: ${{ steps.pull.outputs.failed }}
    steps:
      - uses: actions/checkout@v7

      - name: Pull open interest from the OCC
        id: pull
        run: |
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          new=false
          failed=""
          for symbol in $(python3 -c 'import nvda_oi; print(*nvda_oi.SYMBOLS)'); do
            echo "::group::$symbol"
            # The gamma exposure snapshot goes first so the page built next embeds
            # it. With the market closed there is nothing new to pull, so the
            # snapshot already published is carried over. The page works without one.
            python3 nvda_gex.py --symbol "$symbol" --if-open \
              || { curl -fsS "$site/gex_$symbol.json" -o published.json && mv published.json "gex_$symbol.json"; } \
              || echo "No $symbol gamma exposure snapshot this run."
            set +e
            python3 nvda_oi.py --symbol "$symbol" --csv --force --no-chart
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              new=true
            else
              if [ "$code" -eq 75 ]; then
                echo "The OCC has not published $symbol yet; a later run will pick it up."
              else
                # The other symbols still go up; the report job turns the run red.
                echo "::error::The $symbol open interest pull failed (exit $code)."
                failed="$failed $symbol"
              fi
              # Its pages go up with the others', rebuilt from the saved data
              # (75: nothing saved for it yet).
              python3 nvda_oi.py --symbol "$symbol" --rebuild || [ $? -eq 75 ]
            fi
            echo "::endgroup::"
          done
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"
          git add data/*_oi_*.csv
          # Keep a record of which run brought each new day in, to tune the
          # scheduler's hours by. The script notes the first save of a day in
          # availability_log.csv, which is not kept in the repository, so the
          # file exists here only when this run saved a new day.
          if [ -f data/availability_log.csv ]; then
            case "${{ github.event_name }}/${{ inputs.timer }}" in
              workflow_dispatch/true) started_by=scheduler ;;
              workflow_dispatch/*)    started_by=dispatch ;;
              *)                      started_by="${{ github.event_name }}" ;;
            esac
            log=data/occ_arrivals.csv
            [ -f "$log" ] || echo "symbol,asof,saved_at_et,started_by,run_id" > "$log"
            tail -n +2 data/availability_log.csv | tr -d '\r' \
              | sed "s/\$/,$started_by,$GITHUB_RUN_ID/" >> "$log"
            git add "$log"
          fi
          # A timer run republishes only when it saved something new; a push or a
          # manual run always does, so a change to the pages goes up straight away.
          if [ "${{ inputs.timer }}" = "true" ] && { [ "$new" = false ] || git diff --cached --quiet; }; then
            echo "Nothing new since the last run; the pages stay as they are."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the day's CSV to the repository
        if: steps.pull.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "Add open interest data"
          git push

      - name: Build the site
        if: steps.pull.outputs.publish == 'true'
        run: ./build_site.sh

      - uses: actions/upload-pages-artifact@v5
        if: steps.pull.outputs.publish == 'true'
        with:
          path: _site

  deploy:
    needs: pull
    if: needs.pull.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deploy
        uses: actions/deploy-pages@v5

  # A symbol whose pull failed doesn't hold the others back, but the run still
  # ends red so the failure gets noticed.
  report:
    needs: [pull, deploy]
    if: always() && needs.pull.outputs.failed != ''
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::The open interest pull failed for ${{ needs.pull.outputs.failed }}; the other symbols were not held up."
          exit 1
